<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- .ico first for older browsers, which stop at the first icon they
         understand; modern ones pick the best-matching PNG below it. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#023522" />

    <!-- Render-blocking on purpose: it sets data-theme before the first paint,
         so a user who chose dark never sees a white flash while the bundle
         loads. A separate file rather than inline because the production CSP
         is script-src 'self'. -->
    <script src="/theme-init.js"></script>

    <title>Buildify — construction materials and skilled workers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
